services:
  backend:
    build:
      context: ./backend
    container_name: mint_journeys_backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend/mint-journeys
    container_name: mint_journeys_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"